[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel-honeypot"
version = "0.1.0"
description = "AI-Augmented Hybrid Deception Honeypot System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.14.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
doppel = "doppel.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
