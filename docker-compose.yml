version: '3.8'

services:
  doppel:
    build: .
    container_name: doppel_honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      # Mount Docker socket so Doppel can launch isolated ephemeral sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./reports:/app/reports
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DOPPEL_LLM_BASE_URL=${DOPPEL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - DOPPEL_LLM_MODEL=${DOPPEL_LLM_MODEL:-qwen2.5-coder:7b}
      - DOPPEL_LLM_API_KEY=${DOPPEL_LLM_API_KEY:-ollama}
      - DOPPEL_SANDBOX_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
