# Doppel Configuration File
honeypot:
  host: "0.0.0.0"
  port: 2222
  # Used when the active preset defines no banner of its own
  server_banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
  hostname: "prod-api-node-01"
  default_user: "ubuntu"
  accept_any_password: true
  motd: |
    Welcome to Ubuntu 22.04.4 LTS (GNU/Linux 5.15.0-105-generic x86_64)
     * Documentation:  https://help.ubuntu.com
     * Management:     https://landscape.canonical.com
     * Support:        https://ubuntu.com/pro

    System information as of current session:
      System load:  0.18               Processes:             112
      Usage of /:   34.2% of 48.29GB   Users logged in:       1
      Memory usage: 28%                IPv4 address for eth0: 10.0.4.15

    0 updates can be applied immediately.

llm:
  # Remote or local endpoint (e.g. over Tailscale: http://100.x.y.z:11434/v1)
  base_url: "http://127.0.0.1:11434/v1"
  # Any model supported by Ollama, vLLM, or LM Studio (e.g., qwen2.5-coder:7b, llama3.1:8b, mistral-nemo:12b)
  model: "qwen2.5-coder:7b"
  api_key: "ollama"
  timeout_seconds: 45.0
  temperature: 0.2
  # When true, runs deterministic simulated responses without needing an active LLM
  mock_mode: false

deception:
  persona: "ubuntu_web_server"
  tar_pit_delay_ms: 0
  intercept_sensitive_files: true
  intercept_missing_tools: true
  dynamic_honeytokens: true
  # When true, sensitive commands and missing tools route to AI deception even from safe IPs (useful for testing)
  enforce_for_safe_ips: true
  # Public address of the HTTP decoy, used in leaked canary URLs so that stolen
  # tokens reach /auth/v1/verify. Empty: derived from honeypot host + http_sensor_port.
  canary_base_url: ""

sandbox:
  # When true, benign commands run in an ephemeral container.
  # If Docker is unavailable or enabled=false, falls back to full LLM simulation.
  enabled: true
  # Built locally from doppel/sandbox/Dockerfile on first use
  image: "doppel-sandbox:ubuntu-22.04"
  network_disabled: true
  memory_limit: "256m"
  cpu_quota: 50000

analytics:
  db_path: "doppel_telemetry.db"
  enable_mitre_tagging: true
  reports_dir: "reports"
  # Incident reports generated at the same time (each is an LLM call)
  max_concurrent_reports: 2

# IPs that bypass honeypot entirely and get a real sandbox shell.
# Alert/logging still fires so you know they connected, but no deception.
access:
  safe_ips:
    # - "127.0.0.1"   # localhost (uncomment only to bypass deception for local admin SSH)
    - "100.81.22.95" #silverstar
    - "100.119.167.91" # youknow
    - "100.118.57.70" #blackbird
    - "100.117.47.14" #vibhatsu

  # Firewall for the web dashboard (port 8000). Only these IPs / CIDR ranges can
  # open it (HTTP, SSE and WebSocket). Everyone else gets 403.
  # Leave empty to allow loopback (127.0.0.1 / ::1) only.
  dashboard_allowed_ips:
    #- "127.0.0.1"
    #- "::1"
    #- "192.168.1.10"      # replace with your admin IP
    # - "10.0.0.0/24"     # CIDR ranges work too
    - "127.0.0.1"   # localhost
    - "100.81.22.95" #silverstar
    - "100.119.167.91" # youknow
    - "100.118.57.70" #blackbird
    - "100.117.47.14" #vibhatsu


# Commands considered normal/benign for this server persona.
# These are always routed to the real sandbox (never to LLM deception),
# so they look authentic even to a careful attacker.
benign_commands:
  - "ls"
  - "ll"
  - "la"
  - "pwd"
  - "whoami"
  - "id"
  - "echo"
  - "cat"
  - "head"
  - "tail"
  - "grep"
  - "find"
  - "date"
  - "env"
  - "printenv"
  - "df"
  - "du"
  - "free"
  - "mkdir"
  - "touch"
  - "cp"
  - "mv"
  - "rm"
  - "chmod"
  - "chown"
  - "wc"
  - "sort"
  - "uniq"
  - "awk"
  - "sed"
  - "cut"
  - "tr"
  - "tee"
  - "less"
  - "more"
  - "file"
  - "stat"
  - "basename"
  - "dirname"
  - "realpath"
  - "which"
  - "type"
  - "man"
  - "help"
  - "alias"
  - "history"
  - "export"
  - "set"
  - "unset"
  - "true"
  - "false"
  - "test"
  - "[[" 
  - "read"
  - "printf"
  - "sleep"
  - "xargs"
  - "tee"
  - "tar"
  - "gzip"
  - "gunzip"
  - "zip"
  - "unzip"
  - "ssh"
  - "scp"
  - "rsync"
  - "python"
  - "python3"
  - "pip"
  - "pip3"
  - "node"
  - "npm"
  - "git"
  - "make"
  - "vim"
  - "nano"
  - "diff"

# HTTP honeypot sensor — listens for web probes (/.env, /wp-admin, SQLi, etc.)
# Set to 0 to disable.
http_sensor_port: 8080

# GeoIP enrichment — download free GeoLite2 databases from MaxMind:
#   https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
# Leave paths empty to run without GeoIP (enrichment returns null fields).
geoip:
  city_db_path: ""   # e.g. /opt/geoip/GeoLite2-City.mmdb
  asn_db_path:  ""   # e.g. /opt/geoip/GeoLite2-ASN.mmdb

# Active Distribution Preset (supports zero-downtime hot reloading)
# Options: ubuntu_web_server, centos_database, debian_cloud_node
active_preset: "ubuntu_web_server"

# Asynchronous Security Alerting
alerts:
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    use_tls: true
    sender_email: "doppel@example.com"
    receiver_email: "soc-alerts@example.com"
    min_threat_score: 60
